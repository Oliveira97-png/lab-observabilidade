global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'telegram-alerts'
  routes:
    - match:
        severity: critical
      receiver: 'telegram-alerts'
      repeat_interval: 30m

receivers:
  - name: 'telegram-alerts'
    telegram_configs:
      - bot_token: '8922457152:AAG1yyf9eo5lQGZMUCXGLroSYRzXzX6O9qs'
        chat_id: 8580019530
        parse_mode: ''
        message: 'ALERTA: {{ .Status }} - {{ .CommonLabels.alertname }} - {{ range .Alerts }}{{ .Labels.instance }}: {{ .Annotations.description }}{{ end }}'

  - name: 'null'
